services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: identity_fusion
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    env_file:
      - .env.example
    volumes:
      - ./mock-data:/mock-data:ro
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - ml-engine

  ml-engine:
    build:
      context: ./ml-engine
    ports:
      - "8010:8010"

  websocket-gateway:
    build:
      context: ./websocket-gateway
    env_file:
      - .env.example
    ports:
      - "8020:8020"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8020/stream
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - websocket-gateway

volumes:
  pgdata:
